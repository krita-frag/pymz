[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pymz-backend"
version = "0.1.0"
description = "PEP 517 build backend for pymz Zig-Python extensions"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]
include = ["pymz_backend*"]
