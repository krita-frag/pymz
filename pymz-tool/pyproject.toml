# Authoritative package metadata for Python 3+ (PEP 517/660).
#
# Python 2.7 uses ``setup.py`` instead, which carries a matching copy of the
# metadata.  Both paths are first-class build methods.
[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymz-tool"
version = "0.1.0"
description = "Zig build tool and Python integration package for pymz extensions"
requires-python = ">=2.7"
license = { text = "MIT" }
dependencies = ["tomli>=1; python_version < '3.11'"]

[project.scripts]
pymz-tool = "pymz_tool.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
pymz_tool = ["py.typed"]
