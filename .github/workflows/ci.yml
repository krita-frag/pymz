name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  ZIG_VERSION: "0.16.0"

jobs:
  zig-tool-tests:
    name: Zig tool unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Run Zig unit tests
        run: cd pymz-tool && zig build test --summary all

  pymz-core-tests:
    name: pymz core unit tests (comptime + contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Run pymz comptime + contract tests
        run: zig build test --summary all

  pymz-runtime-tests:
    name: pymz runtime tests (CPython)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install pymz-tool and pytest
        run: pip install -e pymz-tool pytest
      - name: Run pymz core + contract tests
        run: cd pymz && zig build test --summary all
      - name: Run pymz-tool core tests
        run: cd pymz-tool && zig build test --summary all
      - name: Build and stage jsonz extension
        working-directory: examples/jsonz
        run: ./test.sh
      - name: Run Python tests
        run: python -m pytest examples/jsonz/tests/ pymz-tool/tests/ -v
        env:
          PYTHONPATH: examples/jsonz/python
  python3-matrix:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install pymz-tool
        run: pip install -e pymz-tool
      - name: Build jsonz extension
        working-directory: examples/jsonz
        run: zig build example
      - name: Run Python tests
        run: pytest

  python2-regression:
    # Tests the Python 2.7 compatibility path (setuptools.py helpers).
    # The PEP 517/660 backend and CLI require Python 3.8+; on Python 2, only
    # the setuptools.py integration is available. Full Py2 extension building
    # is verified by the nix-python2-extension job below.
    name: Python 2.7 setuptools.py compatibility
    runs-on: ubuntu-latest
    container: python:2.7
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install setuptools wheel "pytest<5"
      - name: Install setup package
        run: pip install -e .
      - name: Run Python 2 helper tests
        run: python -m pytest pymz-tool/tests -q
      - name: Verify Python 2 loader fallback syntax
        run: python -m py_compile examples/jsonz/python/jsonz/__init__.py

  nix-python2-extension:
    name: Nix CPython 2.7 extension integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Build and test jsonz under CPython 2.7
        run: nix develop .#py27 --command bash -c 'cd examples/jsonz && ./test.sh'

  abi3-wheel:
    name: Stable ABI (abi3) wheel build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build abi3 extension
        working-directory: examples/jsonz
        run: zig build example -Dpymz-runtime=cpython3-limited
      - name: Verify abi3 artifact suffix
        working-directory: examples/jsonz
        run: |
          ls zig-out/lib/
          test -f zig-out/lib/_jsonz.abi3.so || test -f zig-out/lib/_jsonz.abi3.pyd

  pymz-tool-wheel:
    name: pymz-tool wheel build & install
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packaging
        run: pip install packaging
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install pymz-tool
        run: pip install -e pymz-tool
      - name: Build wheel via pymz-tool
        working-directory: examples/jsonz
        run: pymz-tool build
      - name: Verify wheel produced
        working-directory: examples/jsonz
        run: ls dist/*.whl
      - name: Install and test wheel
        working-directory: examples/jsonz
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import jsonz; print(jsonz.validate_json('[1, 2, 3]'))"

  pymz-tool-matrix:
    name: pymz-tool matrix multi-target build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install pymz-tool
        run: pip install -e pymz-tool
      - name: Run matrix build
        working-directory: examples/jsonz
        run: pymz-tool matrix -o dist
      - name: Verify wheel produced
        working-directory: examples/jsonz
        run: |
          ls dist/*.whl
          test "$(ls dist/*.whl | wc -l)" -ge 1

  windows:
    name: Windows native build (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-pytest
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install pymz-tool
        run: pip install -e pymz-tool
      - name: Build jsonz extension
        working-directory: examples/jsonz
        run: zig build example
      - name: Run Python tests
        working-directory: examples/jsonz
        run: pytest
